name: aerotech_reservas_app
description: APE 8 - Sistema distribuido de reservas de vuelos
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/flygo-mark.png
    - assets/images/flygo-hero.png
    - assets/images/flygo-plane-hero.png
    - assets/images/flygo-plane-cutout.png
    - assets/images/flygo-sky-background.png
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
